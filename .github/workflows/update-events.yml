name: Mise à jour hebdomadaire des événements

on:
  schedule:
    - cron: '0 3 * * 1'  # tous les lundis à 3h UTC
  workflow_dispatch: {}   # déclenchement manuel possible depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Faire avancer les événements passés
        run: node scripts/update-events.js

      - name: Committer et pousser si changement
        run: |
          if git diff --quiet; then
            echo "Aucun changement, rien à committer."
            exit 0
          fi
          git config user.name "leguidecambodge"
          git config user.email "leguidecambodge@gmail.com"
          git add index.html
          git commit -m "chore: avance les événements annuels passés à l'année suivante"
          git push
